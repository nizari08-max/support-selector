# mapping.yaml — Column name patterns for auto-detection.
#
# Used by format_detector.py to map any Excel file's columns to the internal
# field names the classifier expects. Engineers can edit this file to add
# patterns when a project uses unusual column headers — no Python changes needed.
#
# Matching rules:
#   - Case-insensitive
#   - Exact match scores highest, then startswith, then substring (min 4 chars)
#   - Patterns listed most-specific → least-specific so "MAX LINE SIZE" wins over "SIZE"
#   - Each Excel column is assigned to at most ONE internal field (greedy, highest score)

columns:

  # ── CRITICAL engineering parameters ─────────────────────────────────────────
  line_number:
    - "new line no"
    - "line number"
    - "line no."
    - "line no"
    - "line tag"
    - "line id"
    - "tag number"
    - "tag no"
    - "pipe number"
    - "pipe no"
    - "line ref"

  sequence_number:
    - "sequence number"
    - "sequence no"
    - "seq number"
    - "seq no"
    - "line sequence"
    - "sequence"

  line_suffix:
    - "line suffix"
    - "insulation class"
    - "insulation code"
    - "insulation"

  size:
    - "max line size"
    - "max. line size"
    - "line size"
    - "size (inch"
    - "size (mm"
    - "nominal size"
    - "nominal pipe size"
    - "nps"
    - "nominal"
    - "dn ("
    - "diameter"
    - "size"

  design_temperature:
    - "design temperature - max"
    - "design temp - max"
    - "design temperature max"
    - "design temperature"
    - "design temp"
    - "temperature - max"
    - "temperature max"
    - "max temperature"
    - "max. temperature"
    - "max temp"
    - "t max"
    - "t-max"
    - "temp max"
    - "temperature"

  min_design_temperature:
    - "min design temp"
    - "minimum temperature"
    - "minimum temp"
    - "min temp"
    - "mdmt"
    - "minimum design temperature"

  operating_temperature:
    - "operating temperature"
    - "operating temp"
    - "oper temp"
    - "normal temp"
    - "operation temperature"
    - "operation temp"
    - "normal operating temperature"
    - "normal operating temp"

  piping_spec:
    - "piping material class"
    - "pipe material class"
    - "piping class"
    - "pipe class"
    - "pipespec"
    - "pipe spec"
    - "pipe-spec"
    - "pipe_spec"
    - "piping spec"
    - "piping specification"
    - "piping material spec"
    - "piping material specification"
    - "material class"
    - "material specification"
    - "material spec"

  material:
    - "material of construction"
    - "moc"
    - "material type"
    - "material"

  from_equipment:
    - "process data from"
    - "line routing from"
    - "from equipment"
    - "from"
    - "source"
    - "origin"

  to_equipment:
    - "process data to"
    - "line routing to"
    - "to equipment"
    - "destination"
    - "dest."
    - "dest"
    - "to"

  from_equipment_tag:
    - "from equipment tag"
    - "from tag"
    - "source equipment tag"
    - "source tag"

  to_equipment_tag:
    - "to equipment tag"
    - "to tag"
    - "destination equipment tag"
    - "destination tag"

  equipment_tag:
    - "equipment tag"
    - "equipment tags"
    - "equip tag"
    - "equip tags"

  # ── USEFUL fields (skip rules if not found) ─────────────────────────────────
  inlet_pressure:
