# ── Scope value dictionaries ──────────────────────────────────────────────────
# Values that indicate a line is IN scope vs EXCLUDED, used when a scope column
# is detected. Matching is case-insensitive against stripped cell values.
scope_values:
  include:
    - "jesa"
    - "stress"
    - "piping stress"
    - "epc"
    - "contractor"
    - "in scope"
  exclude:
    - "vendor"
    - "client"
    - "licensor"
    - "owner"
    - "not in piping scope"
    - "not in scope"
    - "out of scope"

# Keywords searched in free-text NOTES/REMARKS cells when no dedicated scope column exists
scope_text_keywords:
  - "vendor"
  - "client"
  - "licensor"

corrosive_keywords:
  - sulfuric acid
  - sulphuric acid
  - phosphoric acid
  - hydrochloric
  - hydrofluoric
  - chlorine
  - lethal
  - highly toxic
  - category m

# ── Equipment classification keywords ─────────────────────────────────────────
# Used when FROM/TO columns contain descriptive names rather than short tag codes.
# Patterns evaluated in order (first match wins). Place more-specific before generic.
equipment_keywords:
  strain_sensitive:
    - type: reciprocating_pump
      keywords: ["RECIPROCATING PUMP", "RECIPROCATING COMPRESSOR"]
    - type: centrifugal_pump
      keywords: ["CENTRIFUGAL PUMP", "PUMP"]
    - type: compressor
      keywords: ["COMPRESSOR", "BLOWER"]
    - type: turbine
      keywords: ["TURBINE"]
    - type: heater
      keywords: ["FIRED HEATER", "HEATER", "FURNACE", "BOILER"]
    - type: air_cooler
      keywords: ["AIR COOLER", "FIN FAN", "FIN-FAN", "AIR-COOLED"]

  non_strain_sensitive:
    - "TANK"
    - "VESSEL"
    - "DRUM"
    - "TOWER"
    - "COLUMN"
    - "REACTOR"
    - "SEPARATOR"
    - "ABSORBER"
    - "EXCHANGER"
    - "REBOILER"
    - "CONDENSER"
    - "FILTER"
    - "KNOCK-OUT"
    - "KO DRUM"
    - "HEADER"
    - "MANIFOLD"

equipment_tag_codes:
  centrifugal_pump:
    codes: ['PMP', 'CPN', 'CPP']
    description: "Centrifugal pump"

  strain_sensitive_other:
    codes: ['HEX', 'ACE', 'FAN', 'AIR', 'HBL', 'TCR', 'FUR', 'HTR', 'BLR', 'KET']
    description: "Heat exchanger / air cooler / heater / boiler"

  non_strain_sensitive:
    codes: ['REA', 'SCB', 'TNK', 'VSL', 'VES', 'SEP', 'COL', 'FIL', 'DRM', 'TKF', 'REC', 'ABS', 'STR', 'BUF', 'KNK', 'SRG', 'CND', 'ACC']
    description: "Reactor / scrubber / tank / vessel / column"

  ignore_not_equipment:
    codes: ['PSV', 'PRV', 'STE', 'VLV', 'STK', 'FLR', 'BDV', 'SDV', 'MOV']
    description: "Valves / vents / non-process equipment"

# Used by equipment_list_reader.py when an optional equipment list is uploaded.
# Descriptions are matched deterministically; the equipment-list type column is
# intentionally not trusted because client formats vary heavily.
equipment_type_keywords:
  centrifugal_pump:
    keywords: [PUMP, CENTRIFUGAL, CPP, CPN]
    exclude: [RECIPROCATING, DOSING, METERING, VACUUM]
    chart: chart_3_pumps
  reciprocating_pump:
    keywords: [RECIPROCATING PUMP, RECIP, DOSING PUMP, METERING PUMP, DIAPHRAGM PUMP, PISTON PUMP]
    chart: chart_3_strain
  compressor:
    keywords: [COMPRESSOR, BLOWER, FAN COMPRESSOR]
    chart: chart_3_strain
  turbine:
    keywords: [TURBINE, STEAM TURBINE, GAS TURBINE, EXPANDER]
    chart: chart_3_strain
  air_cooler:
    keywords: [AIR COOLER, FIN FAN, AERIAL COOLER, AIR COOLED, FAN COOLER, ACC]
    chart: chart_3_strain
  fired_heater:
    keywords: [FIRED HEATER, FURNACE, HEATER, BOILER, REBOILER, STEAM GENERATOR]
    chart: chart_3_strain
  heat_exchanger_strain:
    keywords: [PLATE EXCHANGER, PLATE AND FRAME, PRINTED CIRCUIT, PCHE, SPIRAL, WELDED PLATE]
    chart: chart_3_strain
  heat_exchanger_standard:
    keywords: [HEAT EXCHANGER, EXCHANGER, COOLER, CONDENSER, REBOILER, TRIM COOLER, E-]
    exclude: [PLATE, PRINTED, SPIRAL, AIR]
    chart: chart_4
    note: "If vendor specifies low nozzle loading -> chart_3_strain"
  vessel:
    keywords: [VESSEL, DRUM, SEPARATOR, FLASH, KO DRUM, KNOCKOUT, SURGE, ACCUMULATOR, BUFFER]
    chart: chart_4
  scrubber_absorber:
    keywords: [SCRUBBER, ABSORBER, WASHER, CONTACTOR, COLUMN, TOWER]
    chart: chart_4
  reactor:
    keywords: [REACTOR, REACTION VESSEL, DIGESTER]
    chart: chart_4
  tank:
    keywords: [TANK, STORAGE, SUMP, PIT, BASIN, POND, RESERVOIR, BULLET]
    chart: chart_4
  filter_strainer:
    keywords: [FILTER, STRAINER, SCREEN, BASKET, CARTRIDGE FILTER, BAG FILTER]
    chart: chart_4
  unknown:
    chart: chart_4

psv_keywords:
  - PSV
  - PRV
  - RV-
  - RELIEF
  - SAFETY VALVE
  - BURSTING DISC
  - RUPTURE DISC
  - BDV
