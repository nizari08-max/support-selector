<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="48%" stop-color="#A8B5C8"/>
      <stop offset="100%" stop-color="#6B7A93"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#001F5C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <rect width="380" height="290" rx="12" fill="#EEF2F7"/>
  <g stroke="#D1D5DB" stroke-width="0.5" opacity="0.62">
    <line x1="0" y1="72" x2="380" y2="72"/>
    <line x1="0" y1="144" x2="380" y2="144"/>
    <line x1="0" y1="216" x2="380" y2="216"/>
    <line x1="95" y1="0" x2="95" y2="290"/>
    <line x1="190" y1="0" x2="190" y2="290"/>
    <line x1="285" y1="0" x2="285" y2="290"/>
  </g>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8" letter-spacing="1">SIDE ELEVATION</text>

  <g id="structure">
    <polygon points="58,231 322,231 312,224 68,224" fill="#9CA3AF" stroke="#374151" stroke-width="0.6"/>
    <rect x="58" y="231" width="264" height="10" rx="1" fill="url(#beam)" stroke="#374151" stroke-width="0.6"/>
    <polygon points="58,241 322,241 316,246 64,246" fill="#1F2937"/>
    <rect x="182" y="246" width="16" height="18" fill="#374151"/>
    <rect x="58" y="264" width="264" height="8" rx="1" fill="url(#beam)" stroke="#374151" stroke-width="0.6"/>
  </g>

  <g id="base-plate">
    <polygon points="121,215 132,209 268,209 279,215" fill="#60A5FA" stroke="#001F5C" stroke-width="1"/>
    <rect x="121" y="215" width="158" height="14" rx="2" fill="url(#steel)" stroke="#001F5C" stroke-width="1.4"/>
    <g fill="#001F5C" opacity="0.8">
      <circle cx="139" cy="222" r="2.5"/>
      <circle cx="261" cy="222" r="2.5"/>
    </g>
  </g>

  <g id="pipe-and-lugs">
    <rect x="168" y="42" width="64" height="174" rx="30" fill="url(#pipe)" stroke="#64748B" stroke-width="2"/>
    <path d="M180 52 V207" stroke="#FFFFFF" stroke-width="4" opacity="0.28"/>
    <path d="M223 54 V207" stroke="#475569" stroke-width="1.2" opacity="0.35"/>
    <line x1="200" y1="35" x2="200" y2="222" stroke="#64748B" stroke-width="0.8" stroke-dasharray="6,4" opacity="0.75"/>

    <rect x="145" y="118" width="23" height="56" rx="2" fill="url(#steel)" stroke="#001F5C" stroke-width="1.4"/>
    <rect x="232" y="118" width="23" height="56" rx="2" fill="url(#steel)" stroke="#001F5C" stroke-width="1.4"/>
    <path d="M168 123 H232 M168 169 H232" stroke="#001F5C" stroke-width="3" opacity="0.28"/>
    <g fill="#E5E7EB" stroke="#001F5C" stroke-width="0.8">
      <circle cx="156" cy="132" r="3"/>
      <circle cx="156" cy="160" r="3"/>
      <circle cx="244" cy="132" r="3"/>
      <circle cx="244" cy="160" r="3"/>
    </g>
  </g>

  <g id="lug-support">
    <rect x="133" y="183" width="134" height="10" rx="2" fill="url(#steelDark)" stroke="#001F5C" stroke-width="1.2"/>
    <path d="M154 183 L174 165 H226 L246 183" fill="none" stroke="#001F5C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M154 183 V216 M246 183 V216" fill="none" stroke="#001F5C" stroke-width="9" stroke-linecap="square"/>
    <path d="M154 183 L174 165 H226 L246 183" fill="none" stroke="#60A5FA" stroke-width="3.2" opacity="0.85"/>
    <path d="M154 183 V216 M246 183 V216" fill="none" stroke="#60A5FA" stroke-width="3.2" opacity="0.85"/>
    <rect x="174" y="160" width="52" height="9" rx="2" fill="url(#steel)" stroke="#001F5C" stroke-width="1"/>
  </g>

  <g stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="6,4">
    <line x1="112" y1="146" x2="288" y2="146"/>
  </g>

  <text x="25" y="98" font-family="Arial,sans-serif" font-size="8" fill="#475569" font-weight="700">VERTICAL PIPE</text>
  <line x1="94" y1="96" x2="169" y2="93" stroke="#475569" stroke-width="0.8"/>

  <text x="25" y="138" font-family="Arial,sans-serif" font-size="8" fill="#003087" font-weight="700">WELDED LUGS</text>
  <line x1="88" y1="136" x2="145" y2="136" stroke="#003087" stroke-width="0.8"/>

  <text x="275" y="172" font-family="Arial,sans-serif" font-size="8" fill="#003087" font-weight="700">LUG SUPPORT FRAME</text>
  <line x1="247" y1="178" x2="273" y2="172" stroke="#003087" stroke-width="0.8"/>

  <text x="287" y="224" font-family="Arial,sans-serif" font-size="8" fill="#003087" font-weight="700">BASE PLATE</text>
  <line x1="279" y1="220" x2="285" y2="220" stroke="#003087" stroke-width="0.8"/>

  <rect x="63" y="270" width="254" height="14" rx="4" fill="#003087"/>
  <text x="190" y="281" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="9" font-weight="700"
        fill="white" letter-spacing="0.8">VERTICAL PIPE LUG SUPPORT (WL03-WL06)</text>
</svg>
