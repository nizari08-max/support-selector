<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="100%" stop-color="#8FA0BB"/>
    </radialGradient>
    <radialGradient id="pg_back" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#B8C4D9"/>
      <stop offset="100%" stop-color="#6B7A93"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="sg_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <linearGradient id="shoe_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <marker id="slide_arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#60A5FA"/>
    </marker>
    <marker id="slide_arr_l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="380" height="290" fill="#EEF2F7" rx="12"/>
  <g stroke="#D1D5DB" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="72" x2="380" y2="72"/>
    <line x1="0" y1="144" x2="380" y2="144"/>
    <line x1="0" y1="216" x2="380" y2="216"/>
    <line x1="95" y1="0" x2="95" y2="290"/>
    <line x1="190" y1="0" x2="190" y2="290"/>
    <line x1="285" y1="0" x2="285" y2="290"/>
  </g>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8" letter-spacing="1">END ELEVATION</text>

  <!-- I-beam structural steel — top flange front face + receding deck + dark rear edge -->
  <polygon points="68,218 312,218 304,212 76,212" fill="url(#sg_top)" stroke="#374151" stroke-width="0.5"/>
  <rect x="68" y="218" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>
  <polygon points="68,227 312,227 308,231 72,231" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="182" y="231" width="16" height="17" fill="#374151"/>
  <polygon points="68,248 312,248 308,252 72,252" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="68" y="252" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>

  <!-- Sole plate — top surface (machined deck, lighter) + front face -->
  <polygon points="116,208 124,202 256,202 264,208" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="1"/>
  <rect x="116" y="208" width="148" height="12" rx="2" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.5"/>
  <!-- Sole plate thin shadow under -->
  <rect x="116" y="220" width="148" height="2" fill="#001F5C" opacity="0.55"/>
  <!-- Slide-direction texture lines on top deck -->
  <g stroke="rgba(255,255,255,0.35)" stroke-width="0.7">
    <line x1="135" y1="203" x2="143" y2="207"/>
    <line x1="160" y1="203" x2="168" y2="207"/>
    <line x1="185" y1="203" x2="193" y2="207"/>
    <line x1="210" y1="203" x2="218" y2="207"/>
    <line x1="235" y1="203" x2="243" y2="207"/>
  </g>

  <!-- Side webs — front face + receding right-side depth face + small top deck -->
  <!-- Left web -->
  <polygon points="116,172 134,172 140,166 122,166" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="0.8"/>
  <polygon points="134,172 140,166 140,202 134,208" fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <rect x="116" y="172" width="18" height="36" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.3"/>
  <!-- Right web -->
  <polygon points="246,172 264,172 270,166 252,166" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="0.8"/>
  <polygon points="264,172 270,166 270,202 264,208" fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <rect x="246" y="172" width="18" height="36" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.3"/>

  <!-- Saddle — back arc (offset, darker) creates depth illusion -->
  <path d="M 137,145 A 64 64 0 0 1 235,145 L 242,151 A 73 73 0 0 0 130,151 Z"
        fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <!-- Saddle — front face arc -->
  <path d="M 141,149 A 64 64 0 0 1 239,149 L 246,155 A 73 73 0 0 0 134,155 Z"
        fill="url(#shoe)" stroke="#001F5C" stroke-width="1.5"/>
  <!-- Saddle — inner machined-face highlight -->
  <path d="M 144,148 A 60 60 0 0 1 236,148"
        fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Saddle — outer rim sheen -->
  <path d="M 134,155 A 73 73 0 0 1 246,155"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>

  <!-- Weld bead at saddle/web junction -->
  <polygon points="134,172 128,184 140,184" fill="#EF4444" opacity="0.85"/>
  <polygon points="246,172 240,184 252,184" fill="#EF4444" opacity="0.85"/>
  <text x="14" y="179" font-family="'Arial',sans-serif" font-size="8" fill="#EF4444" font-weight="700">WELD</text>
  <line x1="42" y1="178" x2="127" y2="178" stroke="#EF4444" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- Pipe — back face (depth) + front face + wall thickness ring + highlight -->
  <circle cx="184" cy="103" r="60" fill="url(#pg_back)" stroke="#475569" stroke-width="0.9" opacity="0.55"/>
  <circle cx="190" cy="108" r="64" fill="url(#pg)" stroke="#64748B" stroke-width="2.5"/>
  <circle cx="190" cy="108" r="56" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="172" cy="90" rx="20" ry="13" fill="rgba(255,255,255,0.45)"/>
  <line x1="190" y1="94" x2="190" y2="122" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="176" y1="108" x2="204" y2="108" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Sliding freedom arrows -->
  <line x1="160" y1="226" x2="140" y2="226" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr_l)"/>
  <line x1="220" y1="226" x2="240" y2="226" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr)"/>
  <text x="190" y="237" font-family="'Arial',sans-serif" font-size="7.5" fill="#60A5FA" font-weight="700" text-anchor="middle">SLIDES FREELY</text>

  <!-- Labels -->
  <text x="296" y="104" font-family="'Arial',sans-serif" font-size="8.5" fill="#475569" font-weight="700">PIPE</text>
  <line x1="256" y1="100" x2="293" y2="102" stroke="#475569" stroke-width="0.8"/>

  <text x="296" y="148" font-family="'Arial',sans-serif" font-size="8.5" fill="#003087" font-weight="700">SADDLE</text>
  <text x="296" y="158" font-family="'Arial',sans-serif" font-size="7" fill="#003087">(WELDED TO PIPE)</text>
  <line x1="246" y1="152" x2="293" y2="150" stroke="#003087" stroke-width="0.8"/>

  <text x="296" y="200" font-family="'Arial',sans-serif" font-size="8.5" fill="#003087" font-weight="700">SOLE PLATE</text>
  <text x="296" y="210" font-family="'Arial',sans-serif" font-size="7" fill="#003087">SH01–SH05</text>
  <line x1="264" y1="214" x2="293" y2="204" stroke="#003087" stroke-width="0.8"/>

  <rect x="68" y="262" width="244" height="22" rx="4" fill="#003087"/>
  <text x="190" y="278" text-anchor="middle"
        font-family="'Arial',sans-serif" font-size="11" font-weight="700"
        fill="white" letter-spacing="1.5">PIPE SHOE (WELDED)</text>
</svg>
