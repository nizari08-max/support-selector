<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="100%" stop-color="#8FA0BB"/>
    </radialGradient>
    <radialGradient id="pg_back" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#B8C4D9"/>
      <stop offset="100%" stop-color="#6B7A93"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="sg_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <linearGradient id="shoe_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <marker id="slide_arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#60A5FA"/>
    </marker>
    <marker id="slide_arr_l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="380" height="290" fill="#EEF2F7" rx="12"/>
  <g stroke="#D1D5DB" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="72" x2="380" y2="72"/>
    <line x1="0" y1="144" x2="380" y2="144"/>
    <line x1="0" y1="216" x2="380" y2="216"/>
    <line x1="95" y1="0" x2="95" y2="290"/>
    <line x1="190" y1="0" x2="190" y2="290"/>
    <line x1="285" y1="0" x2="285" y2="290"/>
  </g>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8" letter-spacing="1">END ELEVATION</text>

  <!-- I-beam structural steel — top deck + front face + rear edge band; web; bottom flange -->
  <polygon points="68,220 312,220 304,214 76,214" fill="url(#sg_top)" stroke="#374151" stroke-width="0.5"/>
  <rect x="68" y="220" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>
  <polygon points="68,229 312,229 308,233 72,233" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="182" y="233" width="16" height="15" fill="#374151"/>
  <polygon points="68,248 312,248 308,252 72,252" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="68" y="252" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>

  <!-- Sole plate — top surface + front face + bottom shadow -->
  <polygon points="118,208 126,202 254,202 262,208" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="1"/>
  <rect x="118" y="208" width="144" height="12" rx="2" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.5"/>
  <rect x="118" y="220" width="144" height="2" fill="#001F5C" opacity="0.55"/>

  <!-- Side webs with 3D depth -->
  <polygon points="118,178 134,178 140,172 124,172" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="0.8"/>
  <polygon points="134,178 140,172 140,202 134,208" fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <rect x="118" y="178" width="16" height="30" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.3"/>
  <polygon points="246,178 262,178 268,172 252,172" fill="url(#shoe_top)" stroke="#001F5C" stroke-width="0.8"/>
  <polygon points="262,178 268,172 268,202 262,208" fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <rect x="246" y="178" width="16" height="30" fill="url(#shoe)" stroke="#001F5C" stroke-width="1.3"/>

  <!-- Saddle — back face arc -->
  <path d="M 137,151 A 64 64 0 0 1 235,151 L 242,157 A 73 73 0 0 0 130,157 Z"
        fill="#001F5C" stroke="#001F5C" stroke-width="0.6"/>
  <!-- Saddle — front face arc -->
  <path d="M 141,155 A 64 64 0 0 1 239,155 L 246,161 A 73 73 0 0 0 134,161 Z"
        fill="url(#shoe)" stroke="#001F5C" stroke-width="1.5"/>
  <!-- Saddle — inner machined-face highlight -->
  <path d="M 144,154 A 60 60 0 0 1 236,154"
        fill="none" stroke="rgba(147,197,253,0.55)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 134,161 A 73 73 0 0 1 246,161"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.4"/>

  <!-- Pipe — back face + front face + ID ring + highlight -->
  <circle cx="184" cy="109" r="60" fill="url(#pg_back)" stroke="#475569" stroke-width="0.9" opacity="0.55"/>
  <circle cx="190" cy="114" r="64" fill="url(#pg)" stroke="#64748B" stroke-width="2.5"/>
  <circle cx="190" cy="114" r="56" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="172" cy="96" rx="20" ry="13" fill="rgba(255,255,255,0.45)"/>
  <line x1="190" y1="100" x2="190" y2="128" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="176" y1="114" x2="204" y2="114" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- U-bolt — drawn as round rod with two parallel edges + body fill -->
  <!-- Body fill (thick stroke = rod diameter) -->
  <path d="M 152,206 L 152,88 Q 152,72 168,72 H 212 Q 228,72 228,88 L 228,206"
        fill="none" stroke="#1E3A8A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Outer (top/left) sheen edge -->
  <path d="M 149,206 L 149,87 Q 149,69 167,69 H 213 Q 231,69 231,87 L 231,206"
        fill="none" stroke="rgba(147,197,253,0.75)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner (bottom/right) shadow edge -->
  <path d="M 155,206 L 155,89 Q 155,75 169,75 H 211 Q 225,75 225,89 L 225,206"
        fill="none" stroke="#001F5C" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hex nuts — anchor heads at top of legs -->
  <polygon points="143,68 147,63 161,63 165,68 161,73 147,73" fill="#1E3A8A" stroke="#60A5FA" stroke-width="0.8"/>
  <polygon points="215,68 219,63 233,63 237,68 233,73 219,73" fill="#1E3A8A" stroke="#60A5FA" stroke-width="0.8"/>
  <line x1="148" y1="68" x2="160" y2="68" stroke="rgba(147,197,253,0.6)" stroke-width="0.6"/>
  <line x1="220" y1="68" x2="232" y2="68" stroke="rgba(147,197,253,0.6)" stroke-width="0.6"/>
  <!-- Tightening hex nuts at sole plate -->
  <polygon points="143,206 147,201 161,201 165,206 161,211 147,211" fill="#374151" stroke="#9CA3AF" stroke-width="0.8"/>
  <polygon points="215,206 219,201 233,201 237,206 233,211 219,211" fill="#374151" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="148" y1="206" x2="160" y2="206" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>
  <line x1="220" y1="206" x2="232" y2="206" stroke="rgba(255,255,255,0.4)" stroke-width="0.6"/>

  <!-- Sliding arrows -->
  <line x1="160" y1="226" x2="140" y2="226" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr_l)"/>
  <line x1="220" y1="226" x2="240" y2="226" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr)"/>
  <text x="190" y="237" font-family="'Arial',sans-serif" font-size="7.5" fill="#60A5FA" font-weight="700" text-anchor="middle">SLIDES FREELY</text>

  <!-- Labels -->
  <text x="14" y="80" font-family="'Arial',sans-serif" font-size="8.5" fill="#1E3A8A" font-weight="700">U-BOLT</text>
  <text x="14" y="90" font-family="'Arial',sans-serif" font-size="7" fill="#1E3A8A">CLAMP</text>
  <line x1="50" y1="80" x2="144" y2="76" stroke="#1E3A8A" stroke-width="0.8"/>

  <text x="296" y="110" font-family="'Arial',sans-serif" font-size="8.5" fill="#475569" font-weight="700">PIPE</text>
  <line x1="256" y1="106" x2="293" y2="108" stroke="#475569" stroke-width="0.8"/>

  <text x="296" y="160" font-family="'Arial',sans-serif" font-size="8.5" fill="#003087" font-weight="700">SADDLE</text>
  <text x="296" y="170" font-family="'Arial',sans-serif" font-size="7" fill="#003087">SC01–SC09</text>
  <line x1="246" y1="158" x2="293" y2="158" stroke="#003087" stroke-width="0.8"/>

  <rect x="68" y="262" width="244" height="22" rx="4" fill="#003087"/>
  <text x="190" y="278" text-anchor="middle"
        font-family="'Arial',sans-serif" font-size="11" font-weight="700"
        fill="white" letter-spacing="1.5">SHOE CLAMP / SADDLE</text>
</svg>
