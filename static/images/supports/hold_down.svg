<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <radialGradient id="pg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="100%" stop-color="#8FA0BB"/>
    </radialGradient>
    <radialGradient id="pg_back" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#B8C4D9"/>
      <stop offset="100%" stop-color="#6B7A93"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="sg_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <linearGradient id="hd_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <marker id="up_arr" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 z" fill="#EF4444"/>
    </marker>
    <marker id="down_arr" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="380" height="290" fill="#EEF2F7" rx="12"/>
  <g stroke="#D1D5DB" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="72" x2="380" y2="72"/>
    <line x1="0" y1="144" x2="380" y2="144"/>
    <line x1="0" y1="216" x2="380" y2="216"/>
    <line x1="95" y1="0" x2="95" y2="290"/>
    <line x1="190" y1="0" x2="190" y2="290"/>
    <line x1="285" y1="0" x2="285" y2="290"/>
  </g>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8" letter-spacing="1">END ELEVATION</text>

  <!-- I-beam with 3D depth -->
  <polygon points="68,214 312,214 304,208 76,208" fill="url(#sg_top)" stroke="#374151" stroke-width="0.5"/>
  <rect x="68" y="214" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>
  <polygon points="68,223 312,223 308,227 72,227" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="182" y="227" width="16" height="15" fill="#374151"/>
  <polygon points="68,242 312,242 308,246 72,246" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="68" y="246" width="244" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>

  <!-- Base plate of hold-down (flat plate the rod legs attach to) -->
  <polygon points="106,202 114,196 266,196 274,202" fill="url(#hd_top)" stroke="#001F5C" stroke-width="1"/>
  <rect x="106" y="202" width="168" height="12" rx="2" fill="url(#hd)" stroke="#001F5C" stroke-width="1.5"/>
  <rect x="106" y="214" width="168" height="2" fill="#001F5C" opacity="0.55"/>

  <!-- Pipe — back face + front + ID ring + highlight -->
  <circle cx="184" cy="133" r="60" fill="url(#pg_back)" stroke="#475569" stroke-width="0.9" opacity="0.55"/>
  <circle cx="190" cy="138" r="64" fill="url(#pg)" stroke="#64748B" stroke-width="2.5"/>
  <circle cx="190" cy="138" r="56" fill="none" stroke="#64748B" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="172" cy="120" rx="20" ry="13" fill="rgba(255,255,255,0.45)"/>
  <line x1="190" y1="124" x2="190" y2="152" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="176" y1="138" x2="204" y2="138" stroke="#8FA0BB" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Hold-down strap — bridge bar across top with depth -->
  <polygon points="148,70 232,70 240,64 156,64" fill="url(#hd_top)" stroke="#001F5C" stroke-width="0.8"/>
  <rect x="148" y="70" width="84" height="14" fill="url(#hd)" stroke="#001F5C" stroke-width="1.5"/>
  <rect x="148" y="84" width="84" height="2" fill="#001F5C" opacity="0.6"/>
  <rect x="152" y="73" width="76" height="3" fill="rgba(147,197,253,0.40)"/>

  <!-- Hold-down rod legs as round bars (two parallel edges + body) -->
  <!-- Left leg -->
  <rect x="148" y="84" width="15" height="118" fill="url(#hd)" stroke="#001F5C" stroke-width="1.3"/>
  <line x1="150" y1="86" x2="150" y2="200" stroke="rgba(147,197,253,0.65)" stroke-width="1.1"/>
  <line x1="161" y1="86" x2="161" y2="200" stroke="#001F5C" stroke-width="0.9"/>
  <!-- Right leg -->
  <rect x="217" y="84" width="15" height="118" fill="url(#hd)" stroke="#001F5C" stroke-width="1.3"/>
  <line x1="219" y1="86" x2="219" y2="200" stroke="rgba(147,197,253,0.65)" stroke-width="1.1"/>
  <line x1="230" y1="86" x2="230" y2="200" stroke="#001F5C" stroke-width="0.9"/>

  <!-- Hex tightening nuts at base of legs -->
  <polygon points="142,202 146,197 166,197 170,202 166,207 146,207" fill="#374151" stroke="#9CA3AF" stroke-width="0.8"/>
  <polygon points="211,202 215,197 235,197 239,202 235,207 215,207" fill="#374151" stroke="#9CA3AF" stroke-width="0.8"/>
  <line x1="148" y1="202" x2="164" y2="202" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
  <line x1="217" y1="202" x2="233" y2="202" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>

  <!-- Uplift force arrow -->
  <line x1="62" y1="138" x2="62" y2="50" stroke="#EF4444" stroke-width="2.5" marker-end="url(#up_arr)"/>
  <text x="14" y="100" font-family="'Arial',sans-serif" font-size="8" fill="#EF4444" font-weight="700">UPLIFT</text>
  <text x="14" y="110" font-family="'Arial',sans-serif" font-size="8" fill="#EF4444" font-weight="700">FORCE</text>
  <line x1="42" y1="104" x2="60" y2="104" stroke="#EF4444" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Reaction arrow on bridge bar -->
  <line x1="190" y1="62" x2="190" y2="44" stroke="#22C55E" stroke-width="2" marker-end="url(#up_arr)"/>

  <!-- Labels -->
  <text x="296" y="134" font-family="'Arial',sans-serif" font-size="8.5" fill="#475569" font-weight="700">PIPE</text>
  <line x1="256" y1="130" x2="293" y2="132" stroke="#475569" stroke-width="0.8"/>

  <text x="296" y="74" font-family="'Arial',sans-serif" font-size="8.5" fill="#003087" font-weight="700">HOLD-DOWN</text>
  <text x="296" y="84" font-family="'Arial',sans-serif" font-size="7" fill="#003087">GH01 / GH02</text>
  <line x1="232" y1="76" x2="293" y2="76" stroke="#003087" stroke-width="0.8"/>

  <text x="296" y="206" font-family="'Arial',sans-serif" font-size="8.5" fill="#374151" font-weight="700">HEX NUT</text>
  <line x1="240" y1="204" x2="293" y2="204" stroke="#374151" stroke-width="0.8"/>

  <rect x="68" y="258" width="244" height="22" rx="4" fill="#003087"/>
  <text x="190" y="274" text-anchor="middle"
        font-family="'Arial',sans-serif" font-size="11" font-weight="700"
        fill="white" letter-spacing="1.5">HOLD DOWN SUPPORT</text>
</svg>
