  <text x="326" y="152" fill="#ea580c" font-family="Arial, sans-serif" font-size="9" font-weight="700">RUBBER LINER</text>
  <line x1="260" y1="154" x2="322" y2="152" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
