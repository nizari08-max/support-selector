  <rect x="80" y="272" width="260" height="18" rx="4" fill="#0b2f78"/>
  <text x="210" y="285" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">STRAIGHT CLAMP WITH SOFT LINER</text>
