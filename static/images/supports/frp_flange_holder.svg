      <circle cx="218" cy="113" r="2.6"/>
      <circle cx="218" cy="132" r="2.6"/>
      <circle cx="218" cy="151" r="2.6"/>
      <circle cx="218" cy="164" r="2.6"/>
      <circle cx="240" cy="113" r="2.6"/>
      <circle cx="240" cy="132" r="2.6"/>
      <circle cx="240" cy="151" r="2.6"/>
      <circle cx="240" cy="164" r="2.6"/>
