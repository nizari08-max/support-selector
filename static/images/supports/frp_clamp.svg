<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290">
  <defs>
    <radialGradient id="frppg" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </radialGradient>
    <radialGradient id="frppg_back" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="sg_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="clamp_top_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="clamp_bot_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#001F5C"/>
    </linearGradient>
    <linearGradient id="insert_top_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="insert_bot_g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <marker id="slide_arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#60A5FA"/>
    </marker>
    <marker id="slide_arr_l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <rect width="380" height="290" fill="#EEF2F7" rx="12"/>
  <g stroke="#D1D5DB" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="72" x2="380" y2="72"/>
    <line x1="0" y1="144" x2="380" y2="144"/>
    <line x1="0" y1="216" x2="380" y2="216"/>
    <line x1="95" y1="0" x2="95" y2="290"/>
    <line x1="190" y1="0" x2="190" y2="290"/>
    <line x1="285" y1="0" x2="285" y2="290"/>
  </g>
  <text x="18" y="20" font-family="'Courier New',monospace" font-size="9" fill="#94A3B8" letter-spacing="1">END ELEVATION</text>

  <!-- I-beam structural steel -->
  <polygon points="40,216 340,216 332,210 48,210" fill="url(#sg_top)" stroke="#374151" stroke-width="0.5"/>
  <rect x="40" y="216" width="300" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>
  <polygon points="40,225 340,225 336,229 44,229" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="182" y="229" width="16" height="15" fill="#374151"/>
  <polygon points="40,244 340,244 336,248 44,248" fill="#1F2937" stroke="#374151" stroke-width="0.4"/>
  <rect x="40" y="248" width="300" height="9" rx="1" fill="url(#sg)" stroke="#374151" stroke-width="0.5"/>

  <!-- Base plate of clamp (sliding shoe sole plate) -->
  <polygon points="110,202 118,196 270,196 278,202" fill="#3B82F6" stroke="#001F5C" stroke-width="1"/>
  <rect x="110" y="202" width="160" height="12" rx="2" fill="#1E40AF" stroke="#001F5C" stroke-width="1.5"/>
  <rect x="110" y="214" width="160" height="2" fill="#001F5C" opacity="0.55"/>

  <!-- LOWER HALF — soft insert (orange semicircle below pipe centerline at y=138) -->
  <path d="M 122,138 A 68 68 0 0 0 258,138 L 252,138 A 62 62 0 0 1 128,138 Z"
        fill="url(#insert_bot_g)" stroke="#9A3412" stroke-width="1"/>
  <!-- LOWER HALF — steel shell -->
  <path d="M 110,138 A 80 80 0 0 0 270,138 L 258,138 A 68 68 0 0 1 122,138 Z"
        fill="url(#clamp_bot_g)" stroke="#001F5C" stroke-width="1.5"/>
  <!-- Lower steel shell sheen -->
  <path d="M 114,138 A 76 76 0 0 0 266,138" fill="none" stroke="rgba(96,165,250,0.25)" stroke-width="1.5"/>

  <!-- FRP Pipe — back face + front + lamination ring + highlight -->
  <circle cx="184" cy="133" r="58" fill="url(#frppg_back)" stroke="#047857" stroke-width="0.9" opacity="0.55"/>
  <circle cx="190" cy="138" r="62" fill="url(#frppg)" stroke="#059669" stroke-width="2.5"/>
  <circle cx="190" cy="138" r="54" fill="none" stroke="rgba(5,150,105,0.18)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="173" cy="120" rx="18" ry="12" fill="rgba(255,255,255,0.5)"/>
  <line x1="190" y1="123" x2="190" y2="153" stroke="#34D399" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="176" y1="138" x2="204" y2="138" stroke="#34D399" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- UPPER HALF — soft insert (drawn after pipe so it overlays) -->
  <path d="M 122,138 A 68 68 0 0 1 258,138 L 252,138 A 62 62 0 0 0 128,138 Z"
        fill="url(#insert_top_g)" stroke="#C2410C" stroke-width="1"/>
  <!-- UPPER HALF — steel shell -->
  <path d="M 110,138 A 80 80 0 0 1 270,138 L 258,138 A 68 68 0 0 0 122,138 Z"
        fill="url(#clamp_top_g)" stroke="#001F5C" stroke-width="1.5"/>
  <!-- Upper steel shell sheen -->
  <path d="M 114,138 A 76 76 0 0 1 266,138" fill="none" stroke="rgba(147,197,253,0.45)" stroke-width="1.5"/>

  <!-- Visible split line across the clamp diameter (horizontal at y=138) -->
  <line x1="86" y1="138" x2="294" y2="138" stroke="#001F5C" stroke-width="1.5"/>
  <line x1="110" y1="138" x2="270" y2="138" stroke="#FCD34D" stroke-width="0.8" stroke-dasharray="4,2"/>

  <!-- LEFT bolt flanges (top and bottom halves, meet at split line) -->
  <!-- Top flange -->
  <polygon points="86,108 110,108 110,138 86,138" fill="url(#clamp_top_g)" stroke="#001F5C" stroke-width="1.3"/>
  <polygon points="86,108 92,103 116,103 110,108" fill="#3B82F6" stroke="#001F5C" stroke-width="0.7"/>
  <!-- Bottom flange -->
  <polygon points="86,138 110,138 110,168 86,168" fill="url(#clamp_bot_g)" stroke="#001F5C" stroke-width="1.3"/>
  <polygon points="86,168 92,173 116,173 110,168" fill="#001F5C" stroke="#001F5C" stroke-width="0.7"/>
  <!-- Left flange split (where the two flanges butt together) -->
  <line x1="84" y1="138" x2="112" y2="138" stroke="#FBBF24" stroke-width="0.8"/>

  <!-- LEFT bolt going through both flanges -->
  <rect x="93" y="118" width="11" height="4" fill="#1F2937"/>
  <rect x="93" y="154" width="11" height="4" fill="#1F2937"/>
  <!-- Hex bolt heads -->
  <polygon points="89,118 91,114 105,114 107,118 105,122 91,122" fill="#374151" stroke="#9CA3AF" stroke-width="0.6"/>
  <polygon points="89,158 91,154 105,154 107,158 105,162 91,162" fill="#374151" stroke="#9CA3AF" stroke-width="0.6"/>

  <!-- RIGHT bolt flanges -->
  <polygon points="270,108 294,108 294,138 270,138" fill="url(#clamp_top_g)" stroke="#001F5C" stroke-width="1.3"/>
  <polygon points="270,108 276,103 300,103 294,108" fill="#3B82F6" stroke="#001F5C" stroke-width="0.7"/>
  <polygon points="270,138 294,138 294,168 270,168" fill="url(#clamp_bot_g)" stroke="#001F5C" stroke-width="1.3"/>
  <polygon points="270,168 276,173 300,173 294,168" fill="#001F5C" stroke="#001F5C" stroke-width="0.7"/>
  <line x1="268" y1="138" x2="296" y2="138" stroke="#FBBF24" stroke-width="0.8"/>

  <!-- RIGHT bolts -->
  <rect x="277" y="118" width="11" height="4" fill="#1F2937"/>
  <rect x="277" y="154" width="11" height="4" fill="#1F2937"/>
  <polygon points="273,118 275,114 289,114 291,118 289,122 275,122" fill="#374151" stroke="#9CA3AF" stroke-width="0.6"/>
  <polygon points="273,158 275,154 289,154 291,158 289,162 275,162" fill="#374151" stroke="#9CA3AF" stroke-width="0.6"/>

  <!-- Sliding arrows -->
  <line x1="160" y1="220" x2="140" y2="220" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr_l)"/>
  <line x1="220" y1="220" x2="240" y2="220" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#slide_arr)"/>
  <text x="190" y="232" font-family="'Arial',sans-serif" font-size="7.5" fill="#60A5FA" font-weight="700" text-anchor="middle">SLIDES FREELY</text>

  <!-- Labels -->
  <text x="14" y="84" font-family="'Arial',sans-serif" font-size="8.5" fill="#003087" font-weight="700">SPLIT-RING</text>
  <text x="14" y="94" font-family="'Arial',sans-serif" font-size="7" fill="#003087">CLAMP (TOP)</text>
  <line x1="64" y1="86" x2="148" y2="80" stroke="#003087" stroke-width="0.8"/>

  <text x="14" y="186" font-family="'Arial',sans-serif" font-size="8.5" fill="#EA580C" font-weight="700">SOFT INSERT</text>
  <text x="14" y="196" font-family="'Arial',sans-serif" font-size="7" fill="#EA580C">(GRP/RUBBER)</text>
  <line x1="76" y1="190" x2="124" y2="178" stroke="#EA580C" stroke-width="0.8"/>

  <text x="318" y="120" font-family="'Arial',sans-serif" font-size="8.5" fill="#374151" font-weight="700">BOLTS</text>
  <line x1="296" y1="118" x2="316" y2="118" stroke="#374151" stroke-width="0.8"/>

  <text x="14" y="142" font-family="'Arial',sans-serif" font-size="7.5" fill="#A16207" font-weight="700">SPLIT</text>
  <line x1="42" y1="140" x2="86" y2="138" stroke="#A16207" stroke-width="0.7"/>

  <rect x="68" y="258" width="244" height="22" rx="4" fill="#003087"/>
  <text x="190" y="274" text-anchor="middle"
        font-family="'Arial',sans-serif" font-size="11" font-weight="700"
        fill="white" letter-spacing="1.5">FRP SPLIT-RING CLAMP</text>
</svg>
