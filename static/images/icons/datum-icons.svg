<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- DATUM icon family · 20x20 grid · stroke 1.75 · no fills · currentColor.
       Presentation attrs live on each <symbol> (inherit to children) so icons
       render even when an external <use> reference does not pull in <style>. -->
  <defs>
    <style>
      symbol { stroke: currentColor; fill: none; stroke-width: 1.75;
               stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Workspace: datum corner / sheet origin -->
  <symbol id="ic-workspace" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 16 V4 H16"/>
    <path d="M4 4 L11 11"/>
    <circle cx="13.5" cy="13.5" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Selection: support symbol on a centerline -->
  <symbol id="ic-selection" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="7.5" r="3.6"/>
    <path d="M3 14 h14"/>
    <path d="M10 11.1 V14"/>
  </symbol>

  <!-- Verify: dimension line with witness arrows -->
  <symbol id="ic-verify" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4 V16 M15 4 V16"/>
    <path d="M5 10 H15"/>
    <path d="M7.4 8 L5 10 l2.4 2 M12.6 8 L15 10 l-2.4 2"/>
  </symbol>

  <!-- Arrange: pipe rack — three pipe runs on a steel beam carried by two bents -->
  <symbol id="ic-arrange" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 9 H17.5"/>
    <circle cx="6" cy="6.1" r="1.9"/>
    <circle cx="10" cy="6.1" r="1.9"/>
    <circle cx="14" cy="6.1" r="1.9"/>
    <path d="M5 9 V16"/>
    <path d="M15 9 V16"/>
    <path d="M3.2 16.2 H6.8 M13.2 16.2 H16.8"/>
  </symbol>

  <!-- Reference: sheet index / schedule -->
  <symbol id="ic-reference" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="12" height="14" rx="1"/>
    <path d="M4 7.5 H16 M4 12 H16 M9 7.5 V17"/>
  </symbol>

  <!-- Drawing: title-blocked sheet -->
  <symbol id="ic-drawing" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4" width="13" height="12" rx="1"/>
    <path d="M3.5 12 H9 V16 M9 12 H16.5"/>
  </symbol>

  <!-- Command: cursor / prompt (velocity layer) -->
  <symbol id="ic-command" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 6 L9.5 10 l-4 4"/>
    <path d="M11 14 H15"/>
  </symbol>

  <!-- Run: execute the active tool -->
  <symbol id="ic-run" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 5 V15 L15 10 Z"/>
  </symbol>

  <!-- Carry forward: workflow handoff -->
  <symbol id="ic-carry" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10 H15"/>
    <path d="M11 6 l4 4 -4 4"/>
  </symbol>

  <!-- DXF export: download a drawing -->
  <symbol id="ic-dxf" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3 V12"/>
    <path d="M6.5 8.5 L10 12 l3.5 -3.5"/>
    <path d="M4 15.5 H16"/>
  </symbol>

  <!-- Critical line list: listed lines with a flag on the critical one -->
  <symbol id="ic-linelist" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6 H12"/>
    <path d="M4 10 H12"/>
    <path d="M4 14 H9"/>
    <circle cx="2.4" cy="6" r="0.55" fill="currentColor" stroke="none"/>
    <circle cx="2.4" cy="10" r="0.55" fill="currentColor" stroke="none"/>
    <circle cx="2.4" cy="14" r="0.55" fill="currentColor" stroke="none"/>
    <path d="M15.6 4 V11.5"/>
    <path d="M15.6 4.3 L18.4 5.6 L15.6 6.9 Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Report viewer: a report sheet with a small results chart -->
  <symbol id="ic-report" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2.6 H12 L15.5 6.1 V17.4 H5 Z"/>
    <path d="M12 2.6 V6.1 H15.5"/>
    <path d="M7.6 14 V11"/>
    <path d="M10.2 14 V9.3"/>
    <path d="M12.8 14 V12.2"/>
  </symbol>
</svg>
